name: Release Temple Escape offline HTML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-hollow.yml'
      - '.release/v3.0.0/**'

permissions:
  contents: write

concurrency:
  group: temple-escape-hollow-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install geometry test dependency
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Verify release bytes and offline resources
        run: |
          node scripts/restore-html.mjs
          cd standalone
          sha256sum --check SHA256SUMS.txt
          cd ..
          node scripts/verify-standalone.mjs
          node scripts/extract-assets.mjs
      - name: Check gameplay logic, equipment and creature rig
        run: node --test tests/*.test.js
      - name: Publish a new release with download assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v3.0.0 already exists; leaving its assets unchanged.'
            exit 0
          fi
          gh release create v3.0.0 \
            standalone/TempleEscape-v3.0.0.html \
            standalone/SHA256SUMS.txt \
            THIRD_PARTY_NOTICES.md \
            --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Temple Escape v3.0.0 — Last Descent' \
            --notes-file RELEASE_NOTES.md \
            --latest
