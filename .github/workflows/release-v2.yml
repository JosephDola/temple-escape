name: Refresh Temple Escape v2.0 download

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v2.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Build Reawakened download
        shell: bash
        run: |
          cat > TempleEscape.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Temple Escape — Reawakened</title>
            <meta http-equiv="refresh" content="0;url=https://temple-escape-reawakened.cybertronjoe.chatgpt.site">
            <style>
              html,body{height:100%;margin:0;background:#000;color:#ddd;font-family:system-ui,-apple-system,sans-serif}
              body{display:grid;place-items:center}
              a{color:#fff}
            </style>
          </head>
          <body>
            <p>Opening Temple Escape — Reawakened… <a href="https://temple-escape-reawakened.cybertronjoe.chatgpt.site">Click here if it does not open.</a></p>
            <script>location.replace('https://temple-escape-reawakened.cybertronjoe.chatgpt.site');</script>
          </body>
          </html>
          HTML

      - name: Replace download on existing v2.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v2.0 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload v2.0 TempleEscape.html --clobber --repo "$GITHUB_REPOSITORY"
